[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netinsight-x"
version = "2.0.0"
description = "AI-Driven Distributed Network Monitoring, Traffic Analytics, and Decision Support System (DSS)"
readme = "README.md"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402", "F403", "F405", "BLE001", "G201", "RUF013", "RUF012", "S110"]
